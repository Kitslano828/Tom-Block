quest:
  id: INTRO_TO_HUNTING
  display-name: "A Hunter's First Steps"
  description: "Help Critter Hunter Will identify and capture a Glimmerfly."
  category: HUNTING
  repeatability: ONCE
  start-policy: MANUAL
  prerequisites: []
  start-stage: OBSERVE
  stages:
    OBSERVE:
      display-name: "Study the Glimmerfly"
      on-enter:
        START_TUTORIAL_HUNT:
          type: START_ENCOUNTER
          parameters:
            encounter: TUTORIAL_GLIMMERFLY
      objectives:
        OBSERVE_GLIMMERFLY:
          type: OBSERVE_CRITTER
          target: GLIMMERFLY
          parameters:
            tracker-title: "OBSERVE THE GLIMMERFLY"
            tracker-description: "Watch how the nearby Glimmerfly moves before approaching it"
            tracker-progress: "GLIMMERFLY OBSERVED"
      next-stage: CAPTURE
    CAPTURE:
      display-name: "Make the Capture"
      objectives:
        CAPTURE_GLIMMERFLY:
          type: CAPTURE_CRITTER
          target: GLIMMERFLY
          parameters:
            tracker-title: "CAPTURE THE GLIMMERFLY"
            tracker-description: "Approach at the right moment and complete the hunt"
            tracker-progress: "GLIMMERFLY CAPTURED"
      next-stage: RETURN
    RETURN:
      display-name: "Return to Will"
      objectives:
        REPORT_TO_WILL:
          type: COMPLETE_DIALOGUE
          target: CRITTER_HUNTER_WILL_RETURN
          parameters:
            actor: CRITTER_HUNTER_WILL
            tracker-title: "RETURN TO WILL"
            tracker-description: "Speak with Will and tell him about your first hunt"
            tracker-progress: "WILL SPOKEN TO"

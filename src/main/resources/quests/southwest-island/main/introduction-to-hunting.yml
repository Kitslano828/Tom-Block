quest:
  id: INTRO_TO_HUNTING
  display-name: "A Hunter's First Steps"
  description: "Help Will finish a difficult Mossback hunt, then prove you can lead one yourself."
  category: HUNTING
  repeatability: ONCE
  start-policy: MANUAL
  prerequisites: []
  start-stage: ASSIST_WILL
  stages:
    ASSIST_WILL:
      display-name: "Finish Will's Hunt"
      on-enter:
        START_ASSISTED_HUNT:
          type: START_ENCOUNTER
          parameters:
            encounter: WILLS_MOSSBACK_HUNT
      objectives:
        FINISH_WILLS_HUNT:
          type: COMPLETE_ENCOUNTER
          target: WILLS_MOSSBACK_HUNT
          parameters:
            tracker-title: "FINISH WILL'S HUNT"
            tracker-description: "Move opposite Will's armed snare and pressure the Mossback toward it"
            tracker-progress: "MOSSBACK SAFELY SNARED"
      next-stage: LEARN_FROM_WILL
    LEARN_FROM_WILL:
      display-name: "Learn from Will"
      objectives:
        HEAR_WILLS_LESSON:
          type: COMPLETE_DIALOGUE
          target: CRITTER_HUNTER_WILL_LESSON
          parameters:
            actor: CRITTER_HUNTER_WILL
            tracker-title: "SPEAK WITH WILL"
            tracker-description: "Ask Will how to track, trap, and flush a Mossback"
            tracker-progress: "HUNTING LESSON COMPLETE"
      next-stage: SOLO_HUNT
    SOLO_HUNT:
      display-name: "Lead Your Own Hunt"
      on-enter:
        START_SOLO_HUNT:
          type: START_ENCOUNTER
          parameters:
            encounter: FIRST_SOLO_MOSSBACK_HUNT
      objectives:
        COMPLETE_SOLO_HUNT:
          type: COMPLETE_ENCOUNTER
          target: FIRST_SOLO_MOSSBACK_HUNT
          parameters:
            tracker-title: "LEAD YOUR OWN HUNT"
            tracker-description: "Read the trail, place a snare, and flush the Mossback into it"
            tracker-progress: "FIRST SOLO HUNT COMPLETE"
      next-stage: RETURN
    RETURN:
      display-name: "Return to Will"
      objectives:
        REPORT_TO_WILL:
          type: COMPLETE_DIALOGUE
          target: CRITTER_HUNTER_WILL_RETURN
          parameters:
            actor: CRITTER_HUNTER_WILL
            tracker-title: "RETURN TO WILL"
            tracker-description: "Tell Will how your first solo hunt went"
            tracker-progress: "WILL SPOKEN TO"
  rewards:
    CRITTERDEX:
      type: GIVE_CUSTOM_ITEM
      parameters:
        item: CRITTERDEX
        amount: 1

quests:
  INTRO_TO_HUNTING:
    display-name: "A Hunter's First Steps"
    description: "Help Critter Hunter Will identify and capture a Glimmerfly."
    category: HUNTING
    repeatability: ONCE
    prerequisites: []
    start-stage: ARRIVE
    stages:
      ARRIVE:
        display-name: "A Hunt in Progress"
        objectives:
          APPROACH_WILL:
            type: INTERACT_WITH_ACTOR
            target: CRITTER_HUNTER_WILL
        next-stage: OBSERVE
      OBSERVE:
        display-name: "Study the Glimmerfly"
        objectives:
          OBSERVE_GLIMMERFLY:
            type: OBSERVE_CRITTER
            target: GLIMMERFLY
        next-stage: CAPTURE
      CAPTURE:
        display-name: "Make the Capture"
        objectives:
          CAPTURE_GLIMMERFLY:
            type: CAPTURE_CRITTER
            target: GLIMMERFLY
        next-stage: RETURN
      RETURN:
        display-name: "Return to Will"
        objectives:
          REPORT_TO_WILL:
            type: RETURN_TO_ACTOR
            target: CRITTER_HUNTER_WILL

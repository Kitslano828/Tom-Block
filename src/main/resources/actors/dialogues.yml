dialogues:
  CRITTER_HUNTER_WILL_INTRO:
    starting-node: WARNING
    nodes:
      WARNING:
        text: "Easy there. I'm tracking a Glimmerfly just ahead. Stay close, and watch how it moves before you approach it."
        choices:
          BEGIN_HUNT:
            display-text: "Begin Hunt"
            action: START_QUEST
            parameters:
              quest: INTRO_TO_HUNTING
          NOT_YET:
            display-text: "Not yet"

  CRITTER_HUNTER_WILL_REMINDER:
    starting-node: REMINDER
    nodes:
      REMINDER:
        text: "Keep your eyes on the Glimmerfly. Study its rhythm, then move when it settles."

  CRITTER_HUNTER_WILL_RETURN:
    starting-node: REPORT
    nodes:
      REPORT:
        text: "Nicely done. You watched first and acted at the right moment. That's the beginning of a real hunter's instincts."

  CRITTER_HUNTER_WILL_COMPLETE:
    starting-node: AFTERWARD
    nodes:
      AFTERWARD:
        text: "There are many more critters beyond this trail. Keep observing them, and your journal will grow with you."

  BLACKSMITH_TEST_DIALOGUE:
    starting-node: GREETING
    nodes:
      GREETING:
        text: "Welcome to my forge."
        choices:
          CHECKUP:
            display-text: "How are you?"
            next-node: CHECKUP
          OPEN_FORGE:
            display-text: "Show me what you can forge"
            action: OPEN_FORGE
          PAGINATION_TEST:
            display-text: "Tell me about this forge"
            next-node: PAGINATION_TEST
          CONTINUE:
            display-text: "Continue"
            next-node: GOODBYE

      CHECKUP:
        text: "I am doing alright! How are you?"
        choices:
          CONTINUE:
            display-text: "Continue"
            next-node: GOODBYE

      PAGINATION_TEST:
        text: >-
          This forge has served the town for longer than most people remember.
          Every weapon begins as ordinary metal, but careful heating, patient
          hammering, and a steady hand can turn it into something worth carrying.
          There is always another technique to learn, so even an old blacksmith
          must keep practicing.

      GOODBYE:
        text: "Come back whenever you need something forged."

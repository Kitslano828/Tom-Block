dialogues:
  CRITTER_HUNTER_WILL_INTRO:
    starting-node: WARNING
    nodes:
      WARNING:
        text: "Hey There. I've set snares around a Mossback, but it keeps choosing the wrong cover. Can you help me guide it there?"
        choices:
          BEGIN_HUNT:
            display-text: "Begin Hunt"
            action: START_QUEST
            parameters:
              quest: INTRO_TO_HUNTING
          NOT_YET:
            display-text: "Not yet"

  CRITTER_HUNTER_WILL_REMINDER:
    starting-node: REMINDER
    nodes:
      REMINDER:
        text: "A Mossback runs away from pressure. Keep the armed snare behind it from where you stand, then move in and make it bolt toward the trap."

  CRITTER_HUNTER_WILL_LESSON:
    starting-node: RESULT
    nodes:
      RESULT:
        text: "Nice Work! I think you should lead your own hunt. I think I can see a Mossback nearby"
        choices:
          CONTINUE:
            display-text: "How do I lead my own hunt?"

  CRITTER_HUNTER_WILL_RETURN:
    starting-node: REPORT
    nodes:
      REPORT:
        text: "Congrats on the Hunt! Take this Critterdex, record what you learn, and it'll grow with you."

  CRITTER_HUNTER_WILL_COMPLETE:
    starting-node: AFTERWARD
    nodes:
      AFTERWARD:
        text: "There are tons of critters out there, make sure to keep your eyes open!"

  BLACKSMITH_TEST_DIALOGUE:
    starting-node: GREETING
    nodes:
      GREETING:
        text: "Welcome to my forge."
        choices:
          CHECKUP:
            display-text: "How are you?"
            next-node: CHECKUP
          OPEN_FORGE:
            display-text: "Show me what you can forge"
            action: OPEN_FORGE
          PAGINATION_TEST:
            display-text: "Tell me about this forge"
            next-node: PAGINATION_TEST
          CONTINUE:
            display-text: "Continue"
            next-node: GOODBYE

      CHECKUP:
        text: "I am doing alright! How are you?"
        choices:
          CONTINUE:
            display-text: "Continue"
            next-node: GOODBYE

      PAGINATION_TEST:
        text: >-
          This forge has served the town for longer than most people remember.
          Every weapon begins as ordinary metal, but careful heating, patient
          hammering, and a steady hand can turn it into something worth carrying.
          There is always another technique to learn, so even an old blacksmith
          must keep practicing.

      GOODBYE:
        text: "Come back whenever you need something forged."

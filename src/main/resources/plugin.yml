name: TomBlock
version: 1.0
main: org.tomdang.TomBlock
author: TomDang
api-version: 26.2
libraries:
  - com.zaxxer:HikariCP:7.0.2
  - org.postgresql:postgresql:42.7.8
  - org.flywaydb:flyway-core:13.7.0
  - org.flywaydb:flyway-database-postgresql:13.7.0

commands:
  map:
    description: Gives a whole-world map item with your location marker
    usage: /map
    permission: tomblock.map
  minimap:
    description: Gives a player-centered local map item
    usage: /minimap
    permission: tomblock.map
  maphud:
    description: Tests static, marker-overlay, or live image HUD rendering
    usage: /maphud <static|marker|live|centered|off>
    permission: tomblock.admin.maphud
  mapimage:
    description: Gives a test map item using the exported world image
    usage: /mapimage <full|local>
    permission: tomblock.admin.mapimage
  maptest:
    description: Toggles the experimental village sidebar map
    usage: /maptest
    permission: tomblock.admin.maptest
  setskill:
    description: sets one of your skills to a level or total XP amount
    usage: /setskill <skill> <lvl|xp> <amount>
  getmininglvl:
    description: get the mining level of a player
    aliases:
      mining
  giveminingtool:
    description: give the sender a custom mining tool
  giveweapon:
    description: give the sender a custom weapon
  givecustomitem:
    description: give the sender a registered custom item
    usage: /givecustomitem <id>
  spawncustommob:
    description: spawn a custom mob at the sender's location
    aliases: [spawncustom]
    usage: /spawncustommob <name> [color]
  stats:
    description: returns a customGUI of the sender's stats
  skills:
    description: opens your skill levels and XP progress
  setstat:
    description: sets one of the sender's base stats or resets all base stats
    usage: /setstat <stat> <amount> or /setstat reset
  refreshitems:
    description: refreshes the sender's custom item presentation using current effective stats
    usage: /refreshitems
    permission: tomblock.admin.refreshitems
  givecustomarmor:
    description: gives the sender a custom armor from the registry
    aliases:
      givearmor
  heal:
    description: heal the sender for a specified amount
  useenergy:
    description: spends a specified amount of the spender's energy
  recoverenergy:
    description: recovers a specified amount of the spender's energy
  forge:
    description: opens a custom crafting gui
  dialoguechoice:
    description: This is technically available as a player command, but it is intended primarily as the internal target used by clickable messages.
  spawnnmsnpc:
    description: spawn a custom NMS NPC!
  moveactortest:
    description: a test command to move an actor instance
  followtest:
    description: a test command to make an actor instance follow the sender
  region:
    description: inspects TomBlock region membership at the sender's current block
    usage: /region inspect
    permission: tomblock.admin.region.inspect
  foragingtree:
    description: Manages test trees and the Southwest Island tree-audit overlay
    usage: /foragingtree <spawn|register|grove|audit>
    permission: tomblock.admin.foraging
  island:
    description: Creates or travels to your private island
    usage: /island [home|leave]
    permission: tomblock.island
  collections:
    description: Opens your resource collection progress
    usage: /collections
    permission: tomblock.collections
  quest:
    description: Shows quest progress and provides administrative quest controls
    usage: /quest [inspect|start|signal|branch|complete|reset]
    permission: tomblock.quest

permissions:
  tomblock.collections:
    description: Allows viewing personal collections
    default: true
  tomblock.quest:
    description: Allows viewing personal quest progress
    default: true
  tomblock.admin.quest:
    description: Allows testing and modifying quest progress
    default: op
  tomblock.island:
    description: Allows access to private islands
    default: true
  tomblock.map:
    description: Allows viewing the world and local map items
    default: true
  tomblock.admin.maphud:
    description: Allows testing the resource-pack village map HUD
    default: op
  tomblock.admin.mapimage:
    description: Allows testing the exported world image as a map item
    default: op
  tomblock.admin.maptest:
    description: Allows testing the experimental village map
    default: op
  tomblock.admin.refreshitems:
    description: allows manual refreshing of custom items for testing
    default: op
  tomblock.admin.region.inspect:
    description: allows inspection of configured region membership
    default: op
  tomblock.admin.region.edit:
    description: allows editing and saving region block overrides
    default: op
  tomblock.admin.foraging:
    description: Allows placement of registered foraging test trees
    default: op
